aid: atomwise
name: Atomwise
description: >-
  Atomwise pioneered the use of deep convolutional neural networks for
  structure-based drug discovery, with its AtomNet platform applying AI to
  virtual screening of small molecules against protein targets. The company
  ran the Artificial Intelligence Molecular Screen (AIMS) academic
  collaboration program, partnered with biotech and pharma companies on
  discovery contracts, and built an internal pipeline of small-molecule
  programs. As of 2026, atomwise.com redirects to Numerion Labs
  (numerionlabs.ai), reflecting an apparent rebrand or successor entity that
  positions itself as an AI superplatform exploring drug-like chemical space
  with programs in immune and inflammatory diseases. Atomwise never exposed
  a public commercial API; AtomNet screening was delivered to partners as a
  service. The legacy GitHub organization (github.com/atomwise) hosts no
  public repositories.
